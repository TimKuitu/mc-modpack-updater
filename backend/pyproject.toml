[project]
name = "mc-modpack-updater"
version = "1.0.1"
description = "MC 整合包升级助手 — 面向 PCL2 / PCL-CE 与 26.1+ 年份制版本的整合包识别、升级与导出桌面工具"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pywebview>=6.0",
    "httpx[socks]>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.6.0",
    "pillow>=10.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
